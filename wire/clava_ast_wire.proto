  optional sint64 operator_new = 9;
}

message CXXDeleteExprData {
  ExprData base = 1;
  optional bool is_global = 2;
  optional bool is_array = 3;
  optional bool is_array_as_written = 4;
}

message OffsetOfExprData {
  ExprData base = 1;
  optional sint64 source_type = 2;
  repeated OffsetOfComponent components = 3;
}

message LambdaExprData {
  ExprData base = 1;
  optional bool is_generic_lambda = 2;
  optional bool is_mutable = 3;
  optional bool has_explicit_parameters = 4;
  optional bool has_explicit_result_type = 5;
  optional LambdaCaptureDefault capture_default = 6;
  optional sint64 lambda_class = 7;
  repeated LambdaCaptureKind capture_kinds = 8;
}

message PredefinedExprData {
  ExprData base = 1;
  optional PredefinedIdType predefined_type = 2;
}

message SizeOfPackExprData {
  ExprData base = 1;
  optional bool is_partially_substituted = 2;
  optional sint64 pack = 3;
