message Record {
  oneof record {
    File file = 1;
    Node node = 2;
    Children children = 3;
    NodeClass node_class = 4;
    TopLevel top_level = 5;
    Include include = 6;
    Pragma pragma = 7;
    TranslationUnitFile translation_unit_file = 8;
    Counter counter = 9;
    Language language = 10;
  }
}


message Header {
  optional uint32 protocol_major = 1;
  optional uint32 protocol_minor = 2;
  optional string schema_id = 3;
  optional string producer_version = 4;
  optional uint32 llvm_major = 5;
  optional bytes schema_sha256 = 6;
}
message End {
  optional uint64 records = 1;
  optional uint64 nodes = 2;
  optional uint64 raw_bytes = 3;
  optional uint32 files = 4;
  optional uint64 ids = 5;
}
message Envelope {
  oneof payload {
    Header header = 1;
    Record record = 2;
    End end = 3;
  }
}
