message GCCAsmStmtData {
  AsmStmtData base = 1;
  optional string asm_string = 2;
}

message MSAsmStmtData {
  AsmStmtData base = 1;
  optional string asm_string = 2;
}

message AttributeData {
  NodeData base = 1;
