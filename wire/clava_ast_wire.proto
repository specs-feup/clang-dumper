}

message AsmStmtData {
  StmtData base = 1;
  optional bool is_simple = 2;
  optional bool is_volatile = 3;
  repeated string clobbers = 4;
  repeated AsmOutput outputs = 5;
  repeated AsmInput inputs = 6;
