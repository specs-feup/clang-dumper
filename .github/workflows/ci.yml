name: CI Build and Test

on:
  pull_request:
  workflow_dispatch:

env:
  CLANG_VERSION: "16"

jobs:
  build-and-test-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -eux
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${CLANG_VERSION}
          sudo apt-get install -y \
            llvm-${CLANG_VERSION}-dev \
            libclang-${CLANG_VERSION}-dev \
            libpolly-${CLANG_VERSION}-dev \
            cmake \
            ninja-build \
            zlib1g-dev \
            libedit-dev \
            libzstd-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin and tool
        run: |
          cd build
          ninja plugin tool

      - name: Verify binaries
        run: |
          test -f build/libplugin.so
          test -f build/tool
          ls -lh build/libplugin.so build/tool

      - name: Test tool
        run: |
          cat > test.cpp << 'EOF'
          #include <iostream>
          int main() {
              std::cout << "Hello" << std::endl;
              return 0;
          }
          EOF
          ./build/tool test.cpp > output.txt 2>&1 || true
          grep -q "Compiler Instance Data" output.txt
          echo "✓ Tool works"

      - name: Test plugin
        run: |
          cat > test.cpp << 'EOF'
          #include <iostream>
          int main() {
              std::cout << "Hello" << std::endl;
              return 0;
          }
          EOF
          clang-${CLANG_VERSION} -fplugin=./build/libplugin.so -c test.cpp > output.txt 2>&1 || true
          grep -q "Compiler Instance Data" output.txt
          echo "✓ Plugin works"

  build-windows:
    name: Build (Windows - Cross-compile)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -eux
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${CLANG_VERSION}
          sudo apt-get install -y \
            llvm-${CLANG_VERSION}-dev \
            libclang-${CLANG_VERSION}-dev \
            libpolly-${CLANG_VERSION}-dev \
            cmake \
            ninja-build \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            zlib1g-dev \
            libedit-dev \
            libzstd-dev

      - name: Configure for Windows
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=clang-${CLANG_VERSION} \
            -DCMAKE_C_COMPILER_TARGET=x86_64-w64-windows-gnu \
            -DCMAKE_CXX_COMPILER=clang++-${CLANG_VERSION} \
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-w64-windows-gnu \
            -DLLVM_DIR=/usr/lib/llvm-${CLANG_VERSION}/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/cmake/clang-${CLANG_VERSION}

      - name: Build tool
        run: |
          cd build
          ninja tool

      - name: Verify tool binary
        run: |
          test -f build/tool.exe || test -f build/tool
          ls -lh build/tool* || true
          echo "✓ Windows tool built"

  build-macos:
    name: Build (macOS)
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Don't run brew update - it's slow and often fails
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install llvm@${CLANG_VERSION} ninja || \
            echo "llvm@${CLANG_VERSION} may already be installed"

          # Find LLVM and set for subsequent steps
          if [ -d "/usr/local/opt/llvm@${CLANG_VERSION}" ]; then
            LLVM_PREFIX="/usr/local/opt/llvm@${CLANG_VERSION}"
          elif [ -d "/opt/homebrew/opt/llvm@${CLANG_VERSION}" ]; then
            LLVM_PREFIX="/opt/homebrew/opt/llvm@${CLANG_VERSION}"
          else
            echo "Could not find LLVM installation"
            brew --prefix llvm@${CLANG_VERSION} || true
            exit 1
          fi

          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          ls -la "${LLVM_PREFIX}/bin/" || true

      - name: Verify LLVM installation
        run: |
          echo "LLVM_PREFIX=${LLVM_PREFIX}"
          test -n "${LLVM_PREFIX}" || (echo "LLVM_PREFIX not set"; exit 1)
          test -d "${LLVM_PREFIX}" || (echo "LLVM_PREFIX directory does not exist"; exit 1)
          test -f "${LLVM_PREFIX}/bin/clang" || (echo "clang not found"; exit 1)
          "${LLVM_PREFIX}/bin/clang" --version

      - name: Configure
        env:
          LLVM_PREFIX: ${{ env.LLVM_PREFIX }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DClang_DIR="${LLVM_PREFIX}/lib/cmake/clang"

      - name: Build plugin and tool
        run: |
          cd build
          ninja plugin tool

      - name: Verify binaries
        run: |
          test -f build/tool
          ls -lh build/tool build/libplugin.* || true
          echo "✓ macOS builds completed"
