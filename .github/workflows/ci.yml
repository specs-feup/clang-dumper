name: CI Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  CLANG_VERSION: "16"

jobs:
  build-and-test-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LLVM/Clang ${{ env.CLANG_VERSION }}
        run: |
          set -eux
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${CLANG_VERSION}
          sudo apt-get install -y \
            llvm-${CLANG_VERSION}-dev \
            libclang-${CLANG_VERSION}-dev \
            cmake ninja-build \
            zlib1g-dev libedit-dev libzstd-dev libpolly-${CLANG_VERSION}-dev

      - name: Toolchain diagnostics
        run: |
          set -eux
          node -v
          cmake --version
          ninja --version
          clang-${CLANG_VERSION} --version

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-${CLANG_VERSION}/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/cmake/clang-${CLANG_VERSION}

      - name: Build plugin target
        run: cmake --build build --config Release --target plugin --verbose

      - name: Build tool target
        run: cmake --build build --config Release --target tool --verbose

      - name: Verify binaries exist
        run: |
          set -eux
          test -f build/libplugin.so
          test -f build/tool
          ls -lh build/libplugin.so build/tool

      - name: Create test C++ file
        run: |
          cat > test_sample.cpp << 'EOF'
          #include <iostream>
          #include <string>

          class TestClass {
          public:
              TestClass(const std::string& name) : name_(name) {}
              void greet() {
                  std::cout << "Hello from " << name_ << std::endl;
              }
          private:
              std::string name_;
          };

          int main() {
              TestClass obj("ClangDumper");
              obj.greet();
              return 0;
          }
          EOF

      - name: Test tool executable
        run: |
          set -eux
          ./build/tool test_sample.cpp > tool_output.txt 2>&1 || true
          echo "=== Tool output (first 30 lines) ==="
          head -30 tool_output.txt
          # Verify tool produces expected output
          grep -q "Compiler Instance Data" tool_output.txt
          grep -q "Top Level Nodes" tool_output.txt
          echo "✓ Tool test passed"

      - name: Test plugin with clang
        run: |
          set -eux
          clang-${CLANG_VERSION} -fplugin=./build/libplugin.so -c test_sample.cpp -o test_sample.o > plugin_output.txt 2>&1 || true
          echo "=== Plugin output (first 30 lines) ==="
          head -30 plugin_output.txt
          # Verify plugin produces expected output
          grep -q "Compiler Instance Data" plugin_output.txt
          grep -q "Top Level Nodes" plugin_output.txt
          echo "✓ Plugin test passed"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            build/tool
            build/libplugin.so

  build-and-test-windows:
    name: Build and Test (Windows - Cross-compile)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LLVM/Clang ${{ env.CLANG_VERSION }} and MinGW
        run: |
          set -eux
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${CLANG_VERSION}
          sudo apt-get install -y \
            llvm-${CLANG_VERSION}-dev \
            libclang-${CLANG_VERSION}-dev \
            cmake ninja-build \
            mingw-w64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            zlib1g-dev libedit-dev libzstd-dev libpolly-${CLANG_VERSION}-dev

      - name: Toolchain diagnostics
        run: |
          set -eux
          node -v
          cmake --version
          ninja --version
          clang-${CLANG_VERSION} --version

      - name: Configure (CMake) for Windows
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=clang-${CLANG_VERSION} \
            -DCMAKE_C_COMPILER_TARGET=x86_64-w64-windows-gnu \
            -DCMAKE_CXX_COMPILER=clang++-${CLANG_VERSION} \
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-w64-windows-gnu \
            -DLLVM_DIR=/usr/lib/llvm-${CLANG_VERSION}/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/cmake/clang-${CLANG_VERSION}

      - name: Build plugin target
        run: cmake --build build --config Release --target plugin --verbose

      - name: Build tool target
        run: cmake --build build --config Release --target tool --verbose

      - name: Verify binaries exist
        run: |
          set -eux
          test -f build/libplugin.so || test -f build/libplugin.dll || test -f build/plugin.dll
          test -f build/tool.exe || test -f build/tool
          echo "=== Windows binaries ==="
          ls -lh build/ | grep -E "(tool|plugin)" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/tool.exe
            build/tool
            build/*.dll
            build/*.so

  build-and-test-macos:
    name: Build and Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LLVM/Clang ${{ env.CLANG_VERSION }}
        run: |
          set -eux
          brew update
          brew install llvm@${CLANG_VERSION} ninja zstd libedit libomp pkg-config
          LLVM_PREFIX=$(brew --prefix llvm@${CLANG_VERSION})
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "PATH=${LLVM_PREFIX}/bin:${PATH}" >> "$GITHUB_ENV"

      - name: Toolchain diagnostics
        run: |
          set -eux
          node -v
          cmake --version
          ninja --version
          "${LLVM_PREFIX}/bin/clang" --version

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DClang_DIR="${LLVM_PREFIX}/lib/cmake/clang"

      - name: Build plugin target
        run: cmake --build build --config Release --target plugin --verbose

      - name: Build tool target
        run: cmake --build build --config Release --target tool --verbose

      - name: Verify binaries exist
        run: |
          set -eux
          test -f build/libplugin.so
          test -f build/tool
          ls -lh build/libplugin.so build/tool

      - name: Create test C++ file
        run: |
          cat > test_sample.cpp << 'EOF'
          #include <iostream>
          #include <string>

          class TestClass {
          public:
              TestClass(const std::string& name) : name_(name) {}
              void greet() {
                  std::cout << "Hello from " << name_ << std::endl;
              }
          private:
              std::string name_;
          };

          int main() {
              TestClass obj("ClangDumper");
              obj.greet();
              return 0;
          }
          EOF

      - name: Test tool executable
        run: |
          set -eux
          ./build/tool test_sample.cpp > tool_output.txt 2>&1 || true
          echo "=== Tool output (first 30 lines) ==="
          head -30 tool_output.txt
          # Verify tool produces expected output
          grep -q "Compiler Instance Data" tool_output.txt
          grep -q "Top Level Nodes" tool_output.txt
          echo "✓ Tool test passed"

      - name: Test plugin with clang
        run: |
          set -eux
          "${LLVM_PREFIX}/bin/clang" -fplugin=./build/libplugin.so -c test_sample.cpp -o test_sample.o > plugin_output.txt 2>&1 || true
          echo "=== Plugin output (first 30 lines) ==="
          head -30 plugin_output.txt
          # Verify plugin produces expected output
          grep -q "Compiler Instance Data" plugin_output.txt
          grep -q "Top Level Nodes" plugin_output.txt
          echo "✓ Plugin test passed"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            build/tool
            build/libplugin.so

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test-linux, build-and-test-windows, build-and-test-macos]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "=== Build Results ==="
          echo "Linux: ${{ needs.build-and-test-linux.result }}"
          echo "Windows: ${{ needs.build-and-test-windows.result }}"
          echo "macOS: ${{ needs.build-and-test-macos.result }}"
          
          if [ "${{ needs.build-and-test-linux.result }}" != "success" ]; then
            echo "❌ Linux build failed"
            exit 1
          fi
          if [ "${{ needs.build-and-test-windows.result }}" != "success" ]; then
            echo "❌ Windows build failed"
            exit 1
          fi
          if [ "${{ needs.build-and-test-macos.result }}" != "success" ]; then
            echo "❌ macOS build failed"
            exit 1
          fi
          
          echo "✅ All platform builds succeeded!"
