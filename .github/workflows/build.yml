name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release
  LLVM_VERSION: 18
  LLVM_RELEASE: 18.1.8

jobs:
  generate-enums:
    name: Generate Enums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev

      - name: Generate enum files
        run: |
          rm -rf src/enums_cpp src/enums_java
          python3 -m clang_enums /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib/cmake/llvm src/

      - name: Upload enum artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-enums
          path: |
            src/enums_cpp/
            src/enums_java/
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: generate-enums
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download enum artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-enums
          path: src/

      - name: Install LLVM and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev \
            libpolly-${{ env.LLVM_VERSION }}-dev \
            zlib1g-dev \
            libedit-dev \
            libzstd-dev \
            libxml2-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DSKIP_ENUM_GENERATION=ON \
            -DCLANG_DUMPER_BUILD_TOOL=ON \
            -DCLANG_DUMPER_BUILD_PLUGIN=ON \
            -DCLANG_DUMPER_STATIC_TOOL=ON

      - name: Build
        run: cmake --build build --target tool plugin --parallel

      - name: Test tool
        run: python3 test/run_tests.py --mode tool --path build/tool

      - name: Test plugin
        run: python3 test/run_tests.py --mode plugin --path build/libplugin.so --clang-path clang-${{ env.LLVM_VERSION }}

      - name: Check tool runtime dependencies
        run: |
          ldd build/tool
          if ldd build/tool | grep -E 'lib(clang|LLVM)'; then
            echo "tool still depends on LLVM/Clang dynamic libraries"
            exit 1
          fi

      - name: Upload tool
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-tool
          path: build/tool
          retention-days: 1
          if-no-files-found: error

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-plugin
          path: build/libplugin.so
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: generate-enums
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download enum artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-enums
          path: src/

      - name: Install LLVM
        run: |
          brew install llvm@${{ env.LLVM_VERSION }} zstd
          LLVM_PREFIX="$(brew --prefix llvm@${{ env.LLVM_VERSION }})"
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_OSX_SYSROOT="${SDKROOT}" \
            -DLLVM_PREFIX="${LLVM_PREFIX}" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DClang_DIR="${LLVM_PREFIX}/lib/cmake/clang" \
            -DSKIP_ENUM_GENERATION=ON \
            -DCLANG_DUMPER_BUILD_TOOL=ON \
            -DCLANG_DUMPER_BUILD_PLUGIN=ON \
            -DCLANG_DUMPER_STATIC_TOOL=ON

      - name: Build
        run: cmake --build build --target tool plugin --parallel

      - name: Test tool
        run: python3 test/run_tests.py --mode tool --path build/tool

      - name: Test plugin
        run: python3 test/run_tests.py --mode plugin --path build/libplugin.so --clang-path "${LLVM_PREFIX}/bin/clang"

      - name: Check tool runtime dependencies
        run: |
          otool -L build/tool
          if otool -L build/tool | grep -E 'lib(clang|LLVM)'; then
            echo "tool still depends on LLVM/Clang dynamic libraries"
            exit 1
          fi

      - name: Upload tool
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-tool
          path: build/tool
          retention-days: 1
          if-no-files-found: error

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-plugin
          path: build/libplugin.so
          retention-days: 1
          if-no-files-found: error

  windows-cross:
    name: Windows cross tool
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}-tools \
            curl \
            dpkg \
            tar \
            zstd \
            zip

      - name: Cache Windows cross SDKs
        uses: actions/cache@v5
        with:
          path: .deps
          key: windows-cross-sdk-${{ env.LLVM_RELEASE }}-v1

      - name: Setup Windows cross SDKs
        run: scripts/setup_windows_cross_sdk.sh

      - name: Build Windows tools
        run: |
          CLANG_ENUMS_HOST_CLANG=clang++-${{ env.LLVM_VERSION }} \
            scripts/build_windows_cross.sh

      - name: Check Windows tool binaries
        run: |
          file build-win-arm64/tool.exe build-win-x86_64/tool.exe

          llvm-objdump-${{ env.LLVM_VERSION }} -p build-win-arm64/tool.exe | tee arm64-imports.txt
          llvm-objdump-${{ env.LLVM_VERSION }} -p build-win-x86_64/tool.exe | tee x86_64-imports.txt

          if grep -E 'DLL Name: .*(clang|LLVM|libc\\+\\+|libunwind|zstd|zlib|pthread).*\\.dll' arm64-imports.txt x86_64-imports.txt; then
            echo "Windows tool imports non-system runtime DLLs"
            exit 1
          fi

      - name: Stage Windows tools
        run: |
          mkdir -p dist
          cp build-win-arm64/tool.exe dist/clang-dumper-windows-arm64.exe
          cp build-win-x86_64/tool.exe dist/clang-dumper-windows-x86_64.exe

      - name: Upload Windows ARM64 tool
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-tool
          path: dist/clang-dumper-windows-arm64.exe
          retention-days: 1
          if-no-files-found: error

      - name: Upload Windows x86_64 tool
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-tool
          path: dist/clang-dumper-windows-x86_64.exe
          retention-days: 1
          if-no-files-found: error
