name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release
  LLVM_VERSION: 18
  LLVM_RELEASE: 18.1.8

jobs:
  generate-enums:
    name: Generate Enums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev

      - name: Generate enum files
        run: |
          rm -rf src/enums_cpp src/enums_java
          python3 -m clang_enums /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib/cmake/llvm src/

      - name: Upload enum artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-enums
          path: |
            src/enums_cpp/
            src/enums_java/
          retention-days: 1
          if-no-files-found: error

  windows-includes:
    name: Windows includes ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            package: clang-dumper-windows-arm64-includes.zip
          - arch: x86_64
            package: clang-dumper-windows-x86_64-includes.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            dpkg \
            lld-${{ env.LLVM_VERSION }} \
            python3 \
            rsync \
            tar \
            zstd

      - name: Cache Windows cross SDKs
        uses: actions/cache@v5
        with:
          path: .deps
          key: windows-cross-sdk-${{ env.LLVM_RELEASE }}-${{ matrix.arch }}-v2

      - name: Setup Windows cross SDK
        run: scripts/setup_windows_cross_sdk.sh ${{ matrix.arch }}

      - name: Package Windows includes
        run: scripts/package_windows_includes.sh ${{ matrix.arch }} dist/${{ matrix.package }}

      - name: Upload Windows includes
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-includes
          path: dist/${{ matrix.package }}
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: generate-enums
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            opencl-arg: --enable-opencl
          - arch: arm64
            runner: ubuntu-24.04-arm
            opencl-arg: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download enum artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-enums
          path: src/

      - name: Install LLVM and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev \
            libpolly-${{ env.LLVM_VERSION }}-dev \
            zlib1g-dev \
            libedit-dev \
            libzstd-dev \
            libxml2-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DSKIP_ENUM_GENERATION=ON \
            -DCLANG_DUMPER_BUILD_TOOL=ON \
            -DCLANG_DUMPER_BUILD_PLUGIN=ON \
            -DCLANG_DUMPER_STATIC_TOOL=ON

      - name: Build
        run: cmake --build build --target tool plugin --parallel

      - name: Test tool
        run: |
          python3 test/run_tests.py --mode tool --path build/tool ${{ matrix.opencl-arg }} \
            --baseline-platform linux-${{ matrix.arch }} \
            --failure-output-dir test/failures/linux-${{ matrix.arch }}/tool \
            --raw-output-dir test/raw-outputs/linux-${{ matrix.arch }}/tool

      - name: Test plugin
        run: |
          python3 test/run_tests.py --mode plugin --path build/libplugin.so --clang-path clang-${{ env.LLVM_VERSION }} ${{ matrix.opencl-arg }} \
            --baseline-platform linux-${{ matrix.arch }} \
            --failure-output-dir test/failures/linux-${{ matrix.arch }}/plugin \
            --raw-output-dir test/raw-outputs/linux-${{ matrix.arch }}/plugin

      - name: Upload failed test outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-outputs-linux-${{ matrix.arch }}
          path: test/failures/linux-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload raw test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-test-outputs-linux-${{ matrix.arch }}
          path: test/raw-outputs/linux-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: ignore

      - name: Check tool runtime dependencies
        run: |
          ldd build/tool
          if ldd build/tool | grep -E 'lib(clang|LLVM)'; then
            echo "tool still depends on LLVM/Clang dynamic libraries"
            exit 1
          fi

      - name: Upload tool
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-tool
          path: build/tool
          retention-days: 1
          if-no-files-found: error

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-plugin
          path: build/libplugin.so
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: generate-enums
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            opencl-arg: --enable-opencl
          - arch: arm64
            runner: macos-26
            opencl-arg: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download enum artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-enums
          path: src/

      - name: Install LLVM
        run: |
          brew install llvm@${{ env.LLVM_VERSION }} zstd
          LLVM_PREFIX="$(brew --prefix llvm@${{ env.LLVM_VERSION }})"
          CLANG_RESOURCE_DIR="$("${LLVM_PREFIX}/bin/clang" -print-resource-dir)"
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CLANG_RESOURCE_DIR=${CLANG_RESOURCE_DIR}" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_OSX_SYSROOT="${SDKROOT}" \
            -DLLVM_PREFIX="${LLVM_PREFIX}" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DClang_DIR="${LLVM_PREFIX}/lib/cmake/clang" \
            -DSKIP_ENUM_GENERATION=ON \
            -DCLANG_DUMPER_BUILD_TOOL=ON \
            -DCLANG_DUMPER_BUILD_PLUGIN=ON \
            -DCLANG_DUMPER_STATIC_TOOL=ON

      - name: Build
        run: cmake --build build --target tool plugin --parallel

      - name: Test tool
        run: |
          python3 test/run_tests.py --mode tool --path build/tool ${{ matrix.opencl-arg }} \
            --baseline-platform macos-${{ matrix.arch }} \
            --failure-output-dir test/failures/macos-${{ matrix.arch }}/tool \
            --raw-output-dir test/raw-outputs/macos-${{ matrix.arch }}/tool \
            --extra-clang-arg="-isysroot" \
            --extra-clang-arg="${SDKROOT}" \
            --extra-clang-arg="-nostdinc++" \
            --extra-clang-arg="-isystem" \
            --extra-clang-arg="${LLVM_PREFIX}/include/c++/v1" \
            --extra-clang-arg="-resource-dir=${CLANG_RESOURCE_DIR}"

      - name: Test plugin
        run: |
          python3 test/run_tests.py --mode plugin --path build/libplugin.so --clang-path "${LLVM_PREFIX}/bin/clang" ${{ matrix.opencl-arg }} \
            --baseline-platform macos-${{ matrix.arch }} \
            --failure-output-dir test/failures/macos-${{ matrix.arch }}/plugin \
            --raw-output-dir test/raw-outputs/macos-${{ matrix.arch }}/plugin \
            --extra-clang-arg="-isysroot" \
            --extra-clang-arg="${SDKROOT}" \
            --extra-clang-arg="-nostdinc++" \
            --extra-clang-arg="-isystem" \
            --extra-clang-arg="${LLVM_PREFIX}/include/c++/v1" \
            --extra-clang-arg="-resource-dir=${CLANG_RESOURCE_DIR}"

      - name: Check tool runtime dependencies
        run: |
          otool -L build/tool
          if otool -L build/tool | grep -E 'lib(clang|LLVM)'; then
            echo "tool still depends on LLVM/Clang dynamic libraries"
            exit 1
          fi

      - name: Upload failed test outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-outputs-macos-${{ matrix.arch }}
          path: test/failures/macos-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload raw test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-test-outputs-macos-${{ matrix.arch }}
          path: test/raw-outputs/macos-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload tool
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-tool
          path: build/tool
          retention-days: 1
          if-no-files-found: error

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-plugin
          path: build/libplugin.so
          retention-days: 1
          if-no-files-found: error

  windows-cross:
    name: Windows ${{ matrix.arch }}
    needs:
      - generate-enums
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            build-dir: build-win-arm64
            output: clang-dumper-windows-arm64.exe
          - arch: x86_64
            build-dir: build-win-x86_64
            output: clang-dumper-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download enum artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-enums
          path: src/

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}-tools \
            curl \
            dpkg \
            tar \
            zstd

      - name: Cache Windows cross SDKs
        uses: actions/cache@v5
        with:
          path: .deps
          key: windows-cross-sdk-${{ env.LLVM_RELEASE }}-${{ matrix.arch }}-v2

      - name: Setup Windows cross SDKs
        run: scripts/setup_windows_cross_sdk.sh ${{ matrix.arch }}

      - name: Build Windows tool
        run: |
          CLANG_ENUMS_HOST_CLANG=clang++-${{ env.LLVM_VERSION }} \
          SKIP_ENUM_GENERATION=ON \
            scripts/build_windows_cross.sh ${{ matrix.arch }}

      - name: Check Windows tool binary
        run: |
          file ${{ matrix.build-dir }}/tool.exe

          llvm-objdump-${{ env.LLVM_VERSION }} -p ${{ matrix.build-dir }}/tool.exe | tee imports.txt

          if grep -E 'DLL Name: .*(clang|LLVM|libc\\+\\+|libunwind|zstd|zlib|pthread).*\\.dll' imports.txt; then
            echo "Windows tool imports non-system runtime DLLs"
            exit 1
          fi

      - name: Stage Windows tool
        run: |
          mkdir -p dist
          cp ${{ matrix.build-dir }}/tool.exe dist/${{ matrix.output }}

      - name: Upload Windows tool
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-tool
          path: dist/${{ matrix.output }}
          retention-days: 1
          if-no-files-found: error

  windows-test:
    name: Windows test ${{ matrix.arch }}
    needs:
      - windows-cross
      - windows-includes
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            artifact: windows-arm64-tool
            executable: clang-dumper-windows-arm64.exe
            include-package: clang-dumper-windows-arm64-includes.zip
            triple: aarch64-w64-mingw32
          - arch: x86_64
            runner: windows-2025
            artifact: windows-x86_64-tool
            executable: clang-dumper-windows-x86_64.exe
            include-package: clang-dumper-windows-x86_64-includes.zip
            triple: x86_64-w64-mingw32
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows tool
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Download Windows includes
        uses: actions/download-artifact@v8
        with:
          name: windows-${{ matrix.arch }}-includes
          path: dist/

      - name: Test Windows tool
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python -m zipfile -e "dist/${{ matrix.include-package }}" windows-includes
          INCLUDE_ROOT="$(pwd -W)/windows-includes"

          python test/run_tests.py --mode tool --path "dist/${{ matrix.executable }}" --jobs 1 \
            --baseline-platform windows-${{ matrix.arch }} \
            --failure-output-dir test/failures/windows-${{ matrix.arch }}/tool \
            --raw-output-dir test/raw-outputs/windows-${{ matrix.arch }}/tool \
            --extra-clang-arg="--target=${{ matrix.triple }}" \
            --extra-clang-arg="-Wno-unused-command-line-argument" \
            --extra-clang-arg="-nostdinc" \
            --extra-clang-arg="-nostdinc++" \
            --extra-clang-arg="-isystem" \
            --extra-clang-arg "${INCLUDE_ROOT}/01-libcxx" \
            --extra-clang-arg="-isystem" \
            --extra-clang-arg "${INCLUDE_ROOT}/02-clang" \
            --extra-clang-arg="-isystem" \
            --extra-clang-arg "${INCLUDE_ROOT}/03-mingw"

      - name: Upload failed test outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-outputs-windows-${{ matrix.arch }}
          path: test/failures/windows-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload raw test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-test-outputs-windows-${{ matrix.arch }}
          path: test/raw-outputs/windows-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: ignore
